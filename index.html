<!doctype html>
<!--
  data-sc-lerp: scroll-craft's one global pacing control (src/engine/
  scrollcraft.js, THE PLAYHEAD). Scroll only ever sets the Main Video's
  target time; a rAF loop walks the playhead toward it by this fraction per
  frame. 0.18 is the engine default; 0.15 lets each wheel step settle over
  ~20% more frames (95% of the way in ~18 frames instead of ~15), so the
  footage answers the hand a little more heavily, without changing the
  scroll-to-time mapping, the span, the encoding, or the duration. The
  transitions and the contact form stay a direct function of scroll.
-->
<html lang="en" data-sc-lerp="0.15">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Cuozarsif</title>
    <meta
      name="description"
      content="Cuozarsif — sculpture, gilding, and tattoo, held in one cinematic passage."
    />
    <!-- scroll-craft engine floor, loaded before the brand stylesheet so our
         tokens (in style.css) win the cascade for any shared property. -->
    <link rel="stylesheet" href="/src/engine/scrollcraft.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <section class="opening-loop" aria-label="Opening">
        <video
          class="opening-loop__video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
        >
          <source src="/media/opening-loop.mp4" type="video/mp4" />
        </video>
        <div class="opening-loop__vignette" aria-hidden="true"></div>
        <h1 class="wordmark">Cuozarsif</h1>
        <!--
          The one instruction on the page: the word and a hairline arrow,
          set in the wordmark's own type on the wordmark's own baseline,
          after a divider - one editorial line along the bottom gutter, in
          the frame's dark negative space (the lower centre of the footage
          is the lit marble step). Its opacity is --cue (src/scroll-cue.ts),
          a pure function of the first few pixels of scroll, so it is gone
          before the handoff begins and returns if the reader comes back to
          the top. Purely visual: hidden from assistive tech, never
          focusable.
        -->
        <p class="scroll-cue" aria-hidden="true">
          <span class="scroll-cue__word">Scroll</span>
          <svg class="scroll-cue__arrow" width="8" height="14" viewBox="0 0 8 14" focusable="false">
            <path d="M4 0v12.5M1 10l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </p>
      </section>

      <!--
        Reserves the Opening Loop's scroll distance in normal document flow.
        .opening-loop itself is position:fixed (see style.css) so it renders
        as a pinned stage rather than scrolling away; this empty spacer is
        what the browser actually scrolls through instead. Its height must
        stay in lockstep with .opening-loop's own height (both 100dvh) so
        the Main Video act's measured top (and every scroll-position
        constant in src/ibex-resonance.ts, which reads that same act.top)
        keeps meaning exactly what it already means - real scroll input
        still drives everything, only the visible stage stops tracking it.
      -->
      <div class="opening-loop__spacer" aria-hidden="true"></div>

      <!--
        Main Video: the 32.7s cinematic sequence, scroll-scrubbed via scroll-craft.
        Duration is read from the video element at runtime (scrollcraft.js reads
        video.duration directly, see V.cur * dur in its tick() function), so
        scroll progress 0..1 always spans the actual clip length. Nothing here
        assumes or hardcodes 30s; this is not tied to the original 30s plan.

        data-sc-clip-map="travel" is a deliberate departure from scroll-craft's
        own default (full-life clip mapping). The default starts advancing the
        clip's target time as soon as this section begins entering the
        viewport, which would show the video already a few seconds into its
        timeline the instant it becomes visible: it would not read as an exact
        0:00 handoff from the Opening Loop above. "travel" mapping instead
        holds the clip at frame 0 until the stage is fully pinned (scroll
        progress p = 0 at that exact instant), then maps scroll linearly onto
        currentTime for the rest of the act. That gives the precise, literal
        "scroll position -> video.currentTime" behavior this pass asked for,
        at the cost of the entry-slide smoothing scroll-craft recommends by
        default (not needed here: the Opening Loop above already occupies
        that same slide, and its matching composition is what makes the
        held frame-0 read as continuous rather than frozen).

        data-sc-dwell is intentionally omitted for the same reason: it would
        nonlinearly remap scroll progress onto video time, which contradicts
        "scroll DOWN moves the video forward, scroll UP moves it backward" as
        a direct, predictable relationship.

        No poster image: none was available to derive from the source video
        in this environment. The stage falls back to the page's own dark
        background token until the clip paints. See implementation notes.
      -->
      <section
        class="main-video"
        data-sc-act="scrub"
        data-sc-span="14"
        data-sc-clip-map="travel"
      >
        <div data-sc-stage>
          <video
            data-sc-scrub
            data-sc-src="/media/main-video-g8.mp4"
            playsinline
            muted
          ></video>
        </div>
      </section>

      <!--
        Contact form on the painting scene (Main Video ~16.0s -> 20.5s). A
        fixed layer between the Main Video's stage and the Closing Loop,
        pressed into the gold band the two brushes paint. It is wiped into
        existence along the stroke as the last brush finishes, holds while
        the camera holds, then follows the paint's own measured rise as the
        camera tilts down to the bowl, dissolving as it goes - all as pure
        functions of scroll progress published by src/paint-form.ts
        (--f reveal; --ty/--o/--blur/--sc the ride and the dissolve; --mx1..3
        each groove's own barely-there nudge). The video is untouched.

        Submit validates, then posts the message as JSON to /api/contact
        (api/contact.ts, relayed through Resend); the page never reloads.
      -->
      <section class="paint-form" aria-label="Contact" style="--f: 0; --ty: 0px; --o: 1; --blur: 0px; --sc: 1; --mx1: 0; --mx2: 0; --mx3: 0">
        <!--
          .paint-form__frame is sized to the video's displayed rect (cover
          fit, --vid-*), so everything inside is expressed in the video's own
          coordinates. .paint-form__surface is clipped to the gold stroke's
          actual silhouette, traced from the footage at 19.3s (see
          src/paint-form.ts and style.css): the form can only exist where
          the paint is. Each field is a groove pressed into that paint.
        -->
        <div class="paint-form__frame">
          <form class="paint-form__surface" novalidate>
            <div class="paint-form__grooves">
              <label class="paint-form__field paint-form__field--name">
                <span class="sr-only">Your name</span>
                <input type="text" name="name" placeholder="Your name" autocomplete="name" required />
              </label>
              <label class="paint-form__field paint-form__field--email">
                <span class="sr-only">Your email</span>
                <input type="email" name="email" placeholder="Your email" autocomplete="email" required />
              </label>
              <label class="paint-form__field paint-form__field--message">
                <span class="sr-only">Your message</span>
                <textarea name="message" placeholder="Your message..." rows="2" required></textarea>
              </label>
              <!-- Honeypot: never shown, never focusable; a bot that fills every field trips it (see api/contact.ts). -->
              <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" hidden />
              <button type="submit" class="paint-form__field paint-form__send">Send message <span aria-hidden="true">&rarr;</span></button>
            </div>
            <p class="paint-form__status sr-only" aria-live="polite"></p>
          </form>
        </div>
        <!-- Wet-paint edge for the grooves: a static displacement field, so
             their outlines wobble like something pressed into pigment rather
             than drawn with a ruler. Referenced from style.css. -->
        <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
          <filter id="paint-grooves" x="-6%" y="-12%" width="112%" height="124%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.02 0.055" numOctaves="2" seed="7" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </svg>
      </section>

      <!--
        Closing Loop: a played, looping video (never scrubbed), on a third
        fixed layer in the same viewport stack as the Opening Loop and the
        Main Video's stage. It is revealed through the Main Video's final
        frame by src/closing-wave.ts as a pure function of scroll progress;
        the DOM layer itself only swaps to visible once that reveal is
        complete. The spacer below reserves the scroll distance the wave
        and the closing idle occupy, exactly like .opening-loop__spacer.
      -->
      <section class="closing-loop" aria-label="Closing">
        <video
          class="closing-loop__video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          data-src="/media/closing-loop.mp4"
        ></video>
        <!--
          The loop is 17 MB and is not needed until the very end. On a
          desktop it is attached here, synchronously at parse time, exactly
          as the <source> it replaces was, so nothing about desktop loading
          changes. On a phone (coarse pointer, or a narrow screen) it is
          left unattached and src/closing-wave.ts attaches it once the Main
          Video has arrived or the reader is halfway through the act -
          whichever comes first - so the initial page load never spends
          the reader's data on it.
        -->
        <script>
          (function () {
            var v = document.currentScript.previousElementSibling;
            if (!matchMedia('(hover: none) and (pointer: coarse), (max-width: 860px)').matches) v.src = v.dataset.src;
          })();
        </script>
        <!--
          Editorial layer over the settled Closing Loop. Real text, not
          baked into the video (the loop is clean). It emerges only after
          the Main -> Closing wave has fully finished, keyed to scroll via
          --e (set by src/closing-wave.ts, 0..1) so it is reversible and
          settles into a stable composition at the page's end. Content:
          the name, the three disciplines, and the studio's location as
          small editorial metadata.
        -->
        <div class="closing-editorial" style="--e: 0">
          <span class="closing-editorial__rule closing-editorial__rule--h" aria-hidden="true"></span>
          <span class="closing-editorial__rule closing-editorial__rule--v" aria-hidden="true"></span>
          <span class="closing-editorial__mark" aria-hidden="true"></span>
          <h2 class="closing-editorial__name">Cuozarsif</h2>
          <p class="closing-editorial__disciplines">
            <span>Sculpture</span>
            <span>Painting</span>
            <span>Tatto<span class="tattoo-final-o">o</span></span>
          </p>
          <p class="closing-editorial__place">
            <span class="closing-editorial__place-label">Rotterdam based</span>
            <span class="closing-editorial__place-coords">51.9244° N / 4.4777° E</span>
          </p>
        </div>
      </section>
      <div class="closing-loop__spacer" aria-hidden="true"></div>
    </main>
    <!--
      Ibex Resonance: the Opening -> Main Video signature transition overlay.
      Fixed, pointer-events:none, sits above both video stages. Its content is
      a pure function of scroll progress (see src/ibex-resonance.ts) and is
      fully inert outside the short handoff window and under
      prefers-reduced-motion. Never modifies either video asset.
    -->
    <canvas id="ibex-resonance" aria-hidden="true"></canvas>
    <!-- Main Video -> Closing Loop optical wave (src/closing-wave.ts). Its own
         canvas so the approved Ibex Resonance program is untouched; the two
         never draw at the same scroll position. -->
    <canvas id="closing-wave" aria-hidden="true"></canvas>
    <!-- Vendor, unedited, served verbatim from public/engine/ (a classic
         script under src/ is not bundled by Vite and would 404 in the
         production build). Classic so it runs before
         the deferred module below and window.ScrollCraft exists in time. -->
    <script src="/engine/scrollcraft.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
